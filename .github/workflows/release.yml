name: Release

# Publishes the bootstrap scripts as release assets, so a Pi with curl and no
# git can fetch them, and so a rollout can pin a version instead of taking
# whatever main says that day.
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# Nothing is compiled here - these are shell scripts. The job exists to
# assemble them into one tarball, prove they are syntactically valid and carry
# no private key, and write the notes.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, without the leading v (e.g. 1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing $VERSION"

      - name: Assemble the package
        run: |
          set -euo pipefail
          # Flat, not scripts/ - setup-pi-github-app.sh looks for its helpers
          # in its own directory, so the extracted layout has to put them
          # side by side.
          mkdir -p out
          cp scripts/*.sh out/
          cp README.md out/README.md
          chmod +x out/*.sh
          tar -czf pi-git-auth.tar.gz -C out .
          ls -lh pi-git-auth.tar.gz out/

      - name: Check the package
        run: |
          set -euo pipefail

          # The installer refuses to run without these beside it, so a tarball
          # missing one is a package that fails on the Pi rather than here.
          for f in install.sh setup-pi-github-app.sh michelli-github-app-token.sh \
                   git-credential-michelli.sh fetch-release.sh \
                   pi-connect-github-auth.sh; do
            test -f "out/$f" || { echo "::error::$f missing from the package"; exit 1; }
            bash -n "out/$f"  || { echo "::error::$f is not valid bash";        exit 1; }
          done

          # A private key must never ship. This repo is public, and a PEM
          # committed here would be published to the world - the one secret in
          # the whole scheme, handed out with the installer that uses it.
          if grep -rlE -- "-----BEGIN [A-Z ]*PRIVATE KEY-----" out/ | grep -q .; then
            echo "::error::A private key leaked into the package."
            grep -rlE -- "-----BEGIN [A-Z ]*PRIVATE KEY-----" out/
            exit 1
          fi
          if find . -name "*.pem" -not -path "./.git/*" | grep -q .; then
            echo "::error::A .pem file is committed to this repo."
            find . -name "*.pem" -not -path "./.git/*"
            exit 1
          fi

          # The installer is useless if it cannot find its own defaults.
          grep -q '^CLIENT_ID_DEFAULT="Iv23' out/setup-pi-github-app.sh \
            || { echo "::error::CLIENT_ID_DEFAULT is not baked in"; exit 1; }
          grep -q '^APP_ID_DEFAULT="4260960"' out/setup-pi-github-app.sh \
            || { echo "::error::APP_ID_DEFAULT is not baked in"; exit 1; }

          # install.sh offers the Installation ID as a pressable default; a
          # missing one turns the one-shot back into something you look up.
          grep -qE '^INSTALL_ID_DEFAULT="[0-9]+"' out/install.sh \
            || { echo "::error::INSTALL_ID_DEFAULT is not baked into install.sh"; exit 1; }

          echo "Package OK"

      - name: Prove install.sh runs unattended
        run: |
          set -euo pipefail
          # A throwaway key, generated here and never leaving the runner. It is
          # a structurally valid RSA key that GitHub has never heard of, which
          # is exactly enough to exercise everything up to the token mint.
          openssl genrsa -out /tmp/fake.pem 2048 2>/dev/null

          # --pem skips the paste prompt, so this covers argument parsing, the
          # key check and the hand-off to setup-pi-github-app.sh. The run is
          # expected to fail at the smoke test - the key is not the App's, so
          # GitHub rejects the JWT. Anything failing earlier is a real break,
          # which is why each stage is asserted rather than the exit code.
          set +e
          sudo bash out/install.sh --install-id 145563826 --pem /tmp/fake.pem \
            </dev/null >/tmp/install.log 2>&1
          set -e
          cat /tmp/install.log

          grep -q "Key looks valid" /tmp/install.log \
            || { echo "::error::install.sh did not validate the PEM"; exit 1; }
          grep -q "michelli-github-app-token" /tmp/install.log \
            || { echo "::error::install.sh never reached the helper install"; exit 1; }
          test -f /etc/michelli/github-app.pem \
            || { echo "::error::install.sh did not place the PEM"; exit 1; }

          sudo shred -u /tmp/fake.pem /etc/michelli/github-app.pem
          echo "install.sh OK - failed at the token mint, as an unknown key should"

      - name: Prove it works on a box with no git
        env:
          GH_TOKEN: ${{ github.token }}   # so fetch-release has something to authenticate with
        run: |
          set -euo pipefail
          # The runner has git, curl, jq and openssl preinstalled, so the step
          # above cannot see a missing dependency - which is how v1.1.0 shipped
          # with setup-pi-github-app.sh calling `git config --system` on a box
          # that had no git. A bare Debian container is the fleet's actual
          # starting condition: Pi OS Lite with nothing added.
          openssl genrsa -out out/fake.pem 2048 2>/dev/null

          cat > out/ci-nogit-test.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          if command -v git >/dev/null 2>&1; then
            echo "::error::the base image already has git - this test proves nothing"
            exit 1
          fi

          # Expected to end at the token mint: the key is not the App's. What
          # matters is how far it got first.
          set +e
          bash /pga/install.sh --install-id 145563826 --pem /pga/fake.pem \
            </dev/null >/tmp/log 2>&1
          set -e
          cat /tmp/log

          command -v git >/dev/null 2>&1 \
            || { echo "::error::git was never installed"; exit 1; }
          grep -q "Registered credential helper in /etc/gitconfig" /tmp/log \
            || { echo "::error::install.sh died before registering the helper"; exit 1; }
          test -x /usr/local/bin/git-credential-michelli \
            || { echo "::error::the credential helper is not installed"; exit 1; }
          test -x /usr/local/bin/fetch-release \
            || { echo "::error::fetch-release is not installed"; exit 1; }
          test -x /usr/local/bin/fetch_release \
            || { echo "::error::the fetch_release spelling is missing"; exit 1; }

          # Exercise fetch-release for real, against this repo's own previous
          # release: the workflow token can read it, and it is the only private-
          # repo-shaped thing CI can reach (the App PEM is not here). Covers the
          # API call, the asset listing, suffix matching and the download.
          fetch-release --repo pi-git-auth --list >/tmp/list 2>&1 || {
            echo "::error::fetch-release --list failed"; cat /tmp/list; exit 1; }
          cat /tmp/list
          grep -q "setup-pi-github-app.sh" /tmp/list \
            || { echo "::error::--list did not name the release's assets"; exit 1; }

          cd /tmp
          fetch_release --repo pi-git-auth credential-michelli.sh >/tmp/dl 2>&1 || {
            echo "::error::fetch-release could not download by asset suffix"; cat /tmp/dl; exit 1; }
          cat /tmp/dl
          head -1 /tmp/git-credential-michelli.sh | grep -q "^#!" \
            || { echo "::error::the downloaded asset is not the script"; exit 1; }

          echo "no-git box OK"
          SH

          docker run --rm -e GH_TOKEN -v "$PWD/out:/pga" debian:bookworm-slim \
            bash /pga/ci-nogit-test.sh
          rm -f out/fake.pem out/ci-nogit-test.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          NOTES=$(cat <<EOF
          Bootstrap scripts that let a Raspberry Pi clone and pull private
          GTMichelli-Dev repos through the org's **michelli-fleet** GitHub App.
          No personal access tokens, no SSH keys, no per-Pi GitHub accounts.

          Full walkthrough:
          https://github.com/${GITHUB_REPOSITORY}/blob/main/README.md

          ## Install (one shot)

          Two commands, on any Pi with an internet connection — including a Pi
          OS Lite box with no \`git\`, and including Raspberry Pi Connect's web
          shell:

          \`\`\`
          curl -fsSL -o /tmp/pga-install.sh https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/install.sh
          bash /tmp/pga-install.sh
          \`\`\`

          It offers the Installation ID (\`145563826\`) as the default, takes
          the App's PEM as a paste — BEGIN line to END line, nothing to
          terminate — and does the rest itself: fetches the helpers, writes the
          conf, registers the git credential helper, and smoke-tests against a
          private repo.

          No PEM file to get onto the box first, and no \`</dev/tty\` to
          remember: the prompts read the terminal directly. Re-run it any time
          to refresh the helpers or rotate the key.

          ## What the box can do afterwards

          \`git clone\` and \`git pull\` any private GTMichelli-Dev repo with no
          prompt, and download release packages by name:

          \`\`\`
          fetch-release foundation-web-linux-x64.tar.gz
          fetch-release --repo camera-capture-service linux-arm64.tar.gz
          fetch-release --list
          \`\`\`

          \`fetch-release\` is installed to \`/usr/local/bin\` (as
          \`fetch_release\` too, the spelling the service repos' release notes
          use), and replaces the shell function those notes asked you to paste
          into every new session. It defaults to
          \`GTMichelli-Dev/foundation\`, takes an asset name or any unique
          ending of one, pins with \`--version\`, and lists what a release holds
          when you get the name wrong.

          For a scripted rollout, skip both prompts:

          \`\`\`
          sudo bash /tmp/pga-install.sh --install-id 145563826 --pem /tmp/michelli-app.pem
          \`\`\`

          ## The long way round

          The tarball carries every script, and \`setup-pi-github-app.sh\` can
          still be driven directly:

          \`\`\`
          curl -fsSL -o pga.tar.gz https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/pi-git-auth.tar.gz
          mkdir -p /tmp/pga && tar -xzf pga.tar.gz -C /tmp/pga
          sudo bash /tmp/pga/setup-pi-github-app.sh --install-id 145563826 --pem /path/to/michelli-app.pem
          \`\`\`

          **On this path, take the tarball rather than a single script.**
          \`setup-pi-github-app.sh\` installs \`michelli-github-app-token.sh\`
          and \`git-credential-michelli.sh\` from alongside itself and stops
          with an error if they are not there. \`install.sh\` is the exception:
          downloaded on its own, it fetches the tarball for you. The individual
          scripts are attached for reading, and for replacing one helper on a
          Pi that is already set up.

          ## Verify

          \`\`\`
          git ls-remote https://github.com/GTMichelli-Dev/pi-network-setup.git HEAD
          \`\`\`

          A SHA with no password prompt means it worked. Test against a
          **private** repo — this one, \`foundation\`, \`web-print-service\`
          and \`scale-reader-service\` are public and answer without the
          credential helper being involved at all, so they succeed even on a
          Pi where the whole thing failed.

          ---

          You supply two things: the Installation ID (\`145563826\` for the
          current org installation) and the App's PEM private key. The PEM is
          never committed here — this repo is public.
          EOF
          )

          gh release create "v$V" \
            --title "v$V" \
            --notes "$NOTES" \
            pi-git-auth.tar.gz \
            scripts/install.sh \
            scripts/setup-pi-github-app.sh \
            scripts/fetch-release.sh \
            scripts/michelli-github-app-token.sh \
            scripts/git-credential-michelli.sh \
            scripts/pi-connect-github-auth.sh
